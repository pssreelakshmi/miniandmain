
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard - Upload Image</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <style>
        /* General Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            color: #fff;
        }

        .sidebar .brand {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 20px;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
        }

        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 16px;
            color: #fff;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background-color: #637b95;
            color: #fff;
            border-radius: 10px 10px 0 0;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .card-body {
            padding: 20px;
        }

        .chart-container {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .quick-actions .btn {
            width: 150px;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
        }

        .quick-actions .btn i {
            margin-right: 10px;
        }

        /* Upload Image Form Styles */
        .upload-container {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .upload-container h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #28a745;
        }

        .upload-container form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .upload-container input[type="file"] {
            padding: 0.5rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .upload-container input[type="file"]:hover {
            border-color: #28a745;
        }

        .upload-container button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .upload-container button:hover {
            background-color: #218838;
        }

        @media (max-width: 480px) {
            .upload-container {
                padding: 1.5rem;
            }

            .upload-container h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">Farmer Dashboard</div>
        <a href="{% url 'farmer_dashboard' %}"><i class="fas fa-home"></i> Dashboard</a>
        <a href="{% url 'farmer_profile' %}"><i class="fas fa-user"></i> Profile</a>
        <a href="{% url 'add_product' %}"><i class="fas fa-plus"></i> Add Product</a>
        <a href="{% url 'list_products' %}"><i class="fas fa-list"></i> View Products</a>
        <a href="{% url 'farmer_payment_list' %}"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="{% url 'trends' %}"><i class="fas fa-chart-line"></i> Trends</a>
        <a href="{% url 'farmer_event' %}"><i class="fas fa-calendar-alt"></i> Events</a>
        <a href="{% url 'upload' %}"><i class="fas fa-file-image"></i> Image</a>
        <a href="{% url 'feedback_farm' %}"><i class="fas fa-comments"></i> Feedback</a>
        <a href="{% url 'farmmaterial_view' %}"><i class="fas fa-book"></i> Learning Materials</a>
        <a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="upload-container">
            <h1>Upload Plant Image for Disease Detection</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="image" required>
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>
</body>
</html>
